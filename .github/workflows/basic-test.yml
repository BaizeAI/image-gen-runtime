name: Basic Functionality Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Start server in background
      run: |
        python main.py --model "hf-internal-testing/tiny-stable-diffusion-pipe" --device cpu &
        echo $! > server.pid
        
    - name: Wait for server to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        
    - name: Test metrics endpoint
      run: |
        curl -f http://localhost:8000/metrics
        
    - name: Test image generation
      run: |
        curl -f -X POST http://localhost:8000/v1/images/generations \
          -H "Content-Type: application/json" \
          -d '{
            "prompt": "a simple test image",
            "width": 256,
            "height": 256,
            "num_inference_steps": 1,
            "n": 1
          }' | jq '.data[0].b64_json' | wc -c | awk '{if($1 > 100) print "SUCCESS: Image generated"; else {print "FAILED: Image too small"; exit 1}}'
          
    - name: Stop server
      if: always()
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi